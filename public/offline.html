<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You’re offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafaf7; color: #111110; font: 16px/1.5 "IBM Plex Sans", system-ui, sans-serif; }
      @media (prefers-color-scheme: dark) { body { background: #0e0e0d; color: #f4f2ec; } }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
      h1 { font: 500 1.75rem/1.2 Newsreader, Georgia, serif; margin: 0 0 0.5rem; }
      button { margin-top: 1.25rem; height: 44px; padding: 0 1.25rem; border-radius: 6px; border: 1px solid currentColor; background: transparent; color: inherit; font: 600 15px/1 inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>This page needs the internet. It opens again as soon as you’re back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
