name: community

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: community
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U community -d community"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  app:
    image: ${COMMUNITY_IMAGE:-ghcr.io/villagehq/commonhall:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://community:${POSTGRES_PASSWORD}@postgres:5432/community
      # Caddyfile overwrites this header on every request. Only Caddy can reach the app.
      CLIENT_IP_HEADER: x-real-ip
      # The app calls its own jobs endpoint every minute: email retries and expiring old intro asks.
      JOBS_SELF_TICK: "true"
      # Voice rooms: browsers reach LiveKit through Caddy on the same domain (/rtc); the app talks to it inside docker.
      LIVEKIT_URL: wss://${COMMUNITY_DOMAIN}
      LIVEKIT_API_URL: http://livekit:7880
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/api/health").then((response) => process.exit(response.ok ? 0 : 1), () => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging: *logging

  # Voice rooms (LiveKit, Apache 2.0) on the same server. Its keys are in .env, made by the installer. Never records:
  # no egress service is configured. Media uses TCP 7881 and UDP 50000-50100, which the firewall must allow.
  livekit:
    image: livekit/livekit-server:v1.13
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env (re-run the installer)}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env (re-run the installer)}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        logging:
          level: warn
    expose:
      - "7880"
    ports:
      - "${COMMUNITY_BIND_ADDRESS:+${COMMUNITY_BIND_ADDRESS}:}7881:7881"
      - "${COMMUNITY_BIND_ADDRESS:+${COMMUNITY_BIND_ADDRESS}:}50000-50100:50000-50100/udp"
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - livekit
    environment:
      COMMUNITY_DOMAIN: ${COMMUNITY_DOMAIN:?Set COMMUNITY_DOMAIN in .env}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "${COMMUNITY_BIND_ADDRESS:+${COMMUNITY_BIND_ADDRESS}:}${COMMUNITY_HTTP_PORT:-80}:80"
      - "${COMMUNITY_BIND_ADDRESS:+${COMMUNITY_BIND_ADDRESS}:}${COMMUNITY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
